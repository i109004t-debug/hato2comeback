  RenderingOrRejectAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub 'ht2-${Env}-rendering-or-reject'
      AlarmActions: [!Ref AlertTopic]
      EvaluationPeriods: 1
      DatapointsToAlarm: 1
      TreatMissingData: missing
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      Metrics:
        - Id: total
          Expression: 'SUM([rendering,reject])'
          ReturnData: true
        - Id: rendering
          ReturnData: false
          MetricStat:
            Metric:
              Namespace: AWS/SES
              MetricName: RenderingFailure
            Period: 300
            Stat: Sum
        - Id: reject
          ReturnData: false
          MetricStat:
            Metric:
              Namespace: AWS/SES
              MetricName: Reject
            Period: 300
            Stat: Sum
  StateMachineFailedAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub 'ht2-${Env}-sfn-failed'
      AlarmActions: [!Ref AlertTopic]
      EvaluationPeriods: 1
      DatapointsToAlarm: 1
      TreatMissingData: missing
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      Metrics:
        - Id: total
          Expression: 'SUM([failed,timedout])'
          ReturnData: true
        - Id: failed
          ReturnData: false
          MetricStat:
            Metric:
              Namespace: AWS/States
              MetricName: ExecutionsFailed
              Dimensions: [{Name: StateMachineArn, Value: !Ref BroadcastStateMachine}]
            Period: 300
            Stat: Sum
        - Id: timedout
          ReturnData: false
          MetricStat:
            Metric:
              Namespace: AWS/States
              MetricName: ExecutionsTimedOut
              Dimensions: [{Name: StateMachineArn, Value: !Ref BroadcastStateMachine}]
            Period: 300
            Stat: Sum
  Api5xxAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub 'ht2-${Env}-api-5xx'
      AlarmActions: [!Ref AlertTopic]
      EvaluationPeriods: 1
      DatapointsToAlarm: 1
      TreatMissingData: missing
      Threshold: 1
      ComparisonOperator: GreaterThanThreshold
      Metrics:
        - Id: total
          Expression: 'IF(requests>0,100*errors/requests)'
          ReturnData: true
        - Id: errors
          ReturnData: false
          MetricStat:
            Metric:
              Namespace: AWS/ApiGateway
              MetricName: 5xx
              Dimensions: [{Name: ApiId, Value: !Ref HttpApi}]
            Period: 300
            Stat: Sum
        - Id: requests
          ReturnData: false
          MetricStat:
            Metric:
              Namespace: AWS/ApiGateway
              MetricName: Count
              Dimensions: [{Name: ApiId, Value: !Ref HttpApi}]
            Period: 300
            Stat: Sum
