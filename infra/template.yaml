AWSTemplateFormatVersion: '2010-09-09'
Description: HT2 main stack (ap-northeast-1, one account per environment)
Parameters:
  Env:
    Type: String
    AllowedValues: [dev, stg, prod]
  ExpectedAccountId:
    Type: String
    AllowedPattern: '[0-9]{12}'
  SenderDomain:
    Type: String
    AllowedPattern: '[a-z0-9][a-z0-9.-]+[a-z0-9]'
  AppDomain:
    Type: String
    AllowedPattern: 'app\.[a-z0-9][a-z0-9.-]+'
  HostedZoneId:
    Type: AWS::Route53::HostedZone::Id
  CertificateArn:
    Type: String
    AllowedPattern: 'arn:aws:acm:us-east-1:[0-9]{12}:certificate/.+'
  WebAclArn:
    Type: String
    AllowedPattern: 'arn:aws:wafv2:us-east-1:[0-9]{12}:global/webacl/.+'
  CognitoDomainPrefix:
    Type: String
    AllowedPattern: '^[a-z0-9](?:[a-z0-9-]{0,61}[a-z0-9])?$'
  AlertEmail:
    Type: String
  AuditLockMode:
    Type: String
    Default: GOVERNANCE
    AllowedValues: [GOVERNANCE, COMPLIANCE]
  AuditLockDays:
    Type: Number
    Default: 400
    MinValue: 1
    MaxValue: 36500
  RuntimeVersionArn:
    Type: String
    Default: ''
    AllowedPattern: '(^$|arn:aws:lambda:[a-z0-9-]+::runtime:[a-f0-9]+)'
  ImportRetentionDays:
    Type: Number
    Default: 7
    MinValue: 1
    MaxValue: 7
  SnapshotRetentionDays:
    Type: Number
    Default: 30
    MinValue: 1
    MaxValue: 30
  BackupRetentionDays:
    Type: Number
    Default: 90
    MinValue: 1
    MaxValue: 90
  EventLogRetentionDays:
    Type: Number
    Default: 90
    MinValue: 1
    MaxValue: 90
  WorkerReservedConcurrency:
    Type: Number
    Default: -1
    MinValue: -1
    MaxValue: 1000
    Description: -1 omits reserved concurrency; check account quota before reserving
  OriginSecretStage:
    Type: String
    Default: AWSCURRENT
    AllowedPattern: '[A-Za-z0-9_-]{1,100}'
  Topic1Name:
    Type: String
    Default: kaiho
    AllowedPattern: '[a-z0-9_]{1,20}'
  Topic1Display:
    Type: String
    MaxLength: 128
    Default: 会報
  Topic1Description:
    Type: String
    MaxLength: 500
    Default: 毎月の会報をお届けします
  Topic2Name:
    Type: String
    Default: event
    AllowedPattern: '([a-z0-9_]{1,20})?'
  Topic2Display:
    Type: String
    MaxLength: 128
    Default: イベント・チケット情報
  Topic2Description:
    Type: String
    MaxLength: 500
    Default: イベントやチケット先行受付のお知らせ
Rules:
  AccountAndRegion:
    Assertions:
      - Assert: !Equals [!Ref 'AWS::AccountId', !Ref ExpectedAccountId]
        AssertDescription: Use the dedicated environment account
      - Assert: !Equals [!Ref 'AWS::Region', ap-northeast-1]
        AssertDescription: Main stack must be deployed in Tokyo
  DistinctTopics:
    Assertions:
      - Assert: !Not [!Equals [!Ref Topic1Name, !Ref Topic2Name]]
        AssertDescription: Topic names must be unique
Conditions:
  HasRuntimeVersion: !Not [!Equals [!Ref RuntimeVersionArn, '']]
  HasWorkerReservedConcurrency: !Not [!Equals [!Ref WorkerReservedConcurrency, '-1']]
  IsProd: !Equals [!Ref Env, prod]
  HasTopic2: !Not [!Equals [!Ref Topic2Name, '']]
Resources:
  WebBucket:
    Type: AWS::S3::Bucket
    DeletionPolicy: RetainExceptOnCreate
    UpdateReplacePolicy: Retain
    Properties:
      PublicAccessBlockConfiguration: {BlockPublicAcls: true, BlockPublicPolicy: true, IgnorePublicAcls: true, RestrictPublicBuckets: true}
      BucketEncryption: {ServerSideEncryptionConfiguration: [{ServerSideEncryptionByDefault: {SSEAlgorithm: AES256}}]}
      VersioningConfiguration: {Status: Enabled}
  DataBucket:
    Type: AWS::S3::Bucket
    DeletionPolicy: RetainExceptOnCreate
    UpdateReplacePolicy: Retain
    Properties:
      PublicAccessBlockConfiguration: {BlockPublicAcls: true, BlockPublicPolicy: true, IgnorePublicAcls: true, RestrictPublicBuckets: true}
      BucketEncryption: {ServerSideEncryptionConfiguration: [{ServerSideEncryptionByDefault: {SSEAlgorithm: AES256}}]}
      LifecycleConfiguration:
        Rules:
          - {Id: Staging, Status: Enabled, Prefix: imports/staging/, ExpirationInDays: !Ref ImportRetentionDays}
          - {Id: ImportPreview, Status: Enabled, Prefix: imports/preview/, ExpirationInDays: !Ref ImportRetentionDays}
          - {Id: Ready, Status: Enabled, Prefix: imports/ready/, ExpirationInDays: !Ref ImportRetentionDays}
          - {Id: Reports, Status: Enabled, Prefix: imports/report/, ExpirationInDays: 365}
          - {Id: Recipients, Status: Enabled, Prefix: recipients/, ExpirationInDays: !Ref SnapshotRetentionDays}
          - {Id: Results, Status: Enabled, Prefix: results/, ExpirationInDays: 180}
          - {Id: Contacts, Status: Enabled, Prefix: backups/contacts/, ExpirationInDays: !Ref BackupRetentionDays}
          - {Id: RestoreReports, Status: Enabled, Prefix: restore-reports/, ExpirationInDays: 365}
          - {Id: DeliveryChecks, Status: Enabled, Prefix: delivery-checks/, ExpirationInDays: 180}
          - {Id: Multipart, Status: Enabled, AbortIncompleteMultipartUpload: {DaysAfterInitiation: 1}}
  AuditArchiveBucket:
    Type: AWS::S3::Bucket
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      ObjectLockEnabled: true
      ObjectLockConfiguration:
        ObjectLockEnabled: Enabled
        Rule:
          DefaultRetention: {Mode: !Ref AuditLockMode, Days: !Ref AuditLockDays}
      VersioningConfiguration: {Status: Enabled}
      PublicAccessBlockConfiguration: {BlockPublicAcls: true, BlockPublicPolicy: true, IgnorePublicAcls: true, RestrictPublicBuckets: true}
      BucketEncryption: {ServerSideEncryptionConfiguration: [{ServerSideEncryptionByDefault: {SSEAlgorithm: AES256}}]}
  AuditArchiveBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref AuditArchiveBucket
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Deny
            Principal: '*'
            Action: s3:*
            Resource: [!GetAtt AuditArchiveBucket.Arn, !Sub '${AuditArchiveBucket.Arn}/*']
            Condition: {Bool: {'aws:SecureTransport': 'false'}}
  EventLogBucket:
    Type: AWS::S3::Bucket
    DeletionPolicy: RetainExceptOnCreate
    UpdateReplacePolicy: Retain
    Properties:
      PublicAccessBlockConfiguration: {BlockPublicAcls: true, BlockPublicPolicy: true, IgnorePublicAcls: true, RestrictPublicBuckets: true}
      BucketEncryption: {ServerSideEncryptionConfiguration: [{ServerSideEncryptionByDefault: {SSEAlgorithm: AES256}}]}
      LifecycleConfiguration:
        Rules:
          - {Id: Events, Status: Enabled, Prefix: ses-events/, ExpirationInDays: !Ref EventLogRetentionDays}
          - {Id: Errors, Status: Enabled, Prefix: errors/, ExpirationInDays: !Ref EventLogRetentionDays}
          - {Id: Queries, Status: Enabled, Prefix: athena-results/, ExpirationInDays: 30}
  DataBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref DataBucket
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Deny
            Principal: '*'
            Action: s3:*
            Resource: [!GetAtt DataBucket.Arn, !Sub '${DataBucket.Arn}/*']
            Condition: {Bool: {'aws:SecureTransport': 'false'}}
          - Effect: Allow
            Principal: {Service: ses.amazonaws.com}
            Action: s3:GetObject
            Resource: !Sub '${DataBucket.Arn}/imports/ready/*'
            Condition:
              StringEquals: {'aws:SourceAccount': !Ref 'AWS::AccountId'}
  EventLogBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref EventLogBucket
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Deny
            Principal: '*'
            Action: s3:*
            Resource: [!GetAtt EventLogBucket.Arn, !Sub '${EventLogBucket.Arn}/*']
            Condition: {Bool: {'aws:SecureTransport': 'false'}}
  Table:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: RetainExceptOnCreate
    UpdateReplacePolicy: Retain
    Properties:
      TableName: !Sub 'ht2-${Env}'
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions: [{AttributeName: PK, AttributeType: S}, {AttributeName: SK, AttributeType: S}]
      KeySchema: [{AttributeName: PK, KeyType: HASH}, {AttributeName: SK, KeyType: RANGE}]
      PointInTimeRecoverySpecification: {PointInTimeRecoveryEnabled: true}
      TimeToLiveSpecification: {AttributeName: expires_at, Enabled: true}
      DeletionProtectionEnabled: !If [IsProd, true, false]
      SSESpecification: {SSEEnabled: true}
      StreamSpecification: {StreamViewType: NEW_AND_OLD_IMAGES}
  ConfigurationSet:
    Type: AWS::SES::ConfigurationSet
    Properties:
      Name: !Sub 'ht2-${Env}'
      DeliveryOptions: {TlsPolicy: REQUIRE}
      ReputationOptions: {ReputationMetricsEnabled: true}
      SendingOptions: {SendingEnabled: true}
  EmailIdentity:
    Type: AWS::SES::EmailIdentity
    Properties:
      EmailIdentity: !Ref SenderDomain
      ConfigurationSetAttributes: {ConfigurationSetName: !Ref ConfigurationSet}
      DkimAttributes: {SigningEnabled: true}
      DkimSigningAttributes: {NextSigningKeyLength: RSA_2048_BIT}
      MailFromAttributes:
        MailFromDomain: !Sub 'bounce.${SenderDomain}'
        BehaviorOnMxFailure: REJECT_MESSAGE
  ContactList:
    Type: AWS::SES::ContactList
    DeletionPolicy: RetainExceptOnCreate
    UpdateReplacePolicy: Retain
    Properties:
      ContactListName: ht2
      Description: !Sub 'HT2 ${Env}'
      Topics:
        - TopicName: !Ref Topic1Name
          DisplayName: !Ref Topic1Display
          Description: !Ref Topic1Description
          DefaultSubscriptionStatus: OPT_OUT
        - !If
          - HasTopic2
          - TopicName: !Ref Topic2Name
            DisplayName: !Ref Topic2Display
            Description: !Ref Topic2Description
            DefaultSubscriptionStatus: OPT_OUT
          - !Ref 'AWS::NoValue'
  CloudWatchDestination:
    Type: AWS::SES::ConfigurationSetEventDestination
    Properties:
      ConfigurationSetName: !Ref ConfigurationSet
      EventDestination:
        Name: cloudwatch
        Enabled: true
        MatchingEventTypes: [SEND, REJECT, BOUNCE, COMPLAINT, DELIVERY, DELIVERY_DELAY, SUBSCRIPTION, RENDERING_FAILURE]
        CloudWatchDestination:
          DimensionConfigurations: [{DimensionName: campaign, DimensionValueSource: messageTag, DefaultDimensionValue: none}]
  FirehoseDestination:
    Type: AWS::SES::ConfigurationSetEventDestination
    Properties:
      ConfigurationSetName: !Ref ConfigurationSet
      EventDestination:
        Name: firehose
        Enabled: true
        MatchingEventTypes: [SEND, REJECT, BOUNCE, COMPLAINT, DELIVERY, DELIVERY_DELAY, SUBSCRIPTION, RENDERING_FAILURE]
        KinesisFirehoseDestination: {IAMRoleARN: !GetAtt SesFirehoseRole.Arn, DeliveryStreamARN: !GetAtt EventStream.Arn}
  EventBridgeDestination:
    Type: AWS::SES::ConfigurationSetEventDestination
    Properties:
      ConfigurationSetName: !Ref ConfigurationSet
      EventDestination:
        Name: eventbridge
        Enabled: true
        MatchingEventTypes: [SEND, REJECT, BOUNCE, COMPLAINT, DELIVERY, DELIVERY_DELAY, SUBSCRIPTION, RENDERING_FAILURE]
        EventBridgeDestination:
          EventBusArn: !Sub 'arn:${AWS::Partition}:events:${AWS::Region}:${AWS::AccountId}:event-bus/default'
  EventsRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal: {Service: lambda.amazonaws.com}
            Action: sts:AssumeRole
      Policies:
        - PolicyName: RecipientEvents
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: ['logs:CreateLogStream', 'logs:PutLogEvents']
                Resource: !Sub 'arn:${AWS::Partition}:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/lambda/ht2-${Env}-events:*'
              - Effect: Allow
                Action: ['dynamodb:PutItem']
                Resource: !GetAtt Table.Arn
                Condition: {'ForAllValues:StringLike': {'dynamodb:LeadingKeys': ['ADDR#*']}}
  EventsFunction:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: !Sub 'ht2-${Env}-events'
      Runtime: nodejs24.x
      RuntimeManagementConfig: !If
        - HasRuntimeVersion
        - {UpdateRuntimeOn: Manual, RuntimeVersionArn: !Ref RuntimeVersionArn}
        - {UpdateRuntimeOn: FunctionUpdate}
      Architectures: [arm64]
      Handler: src/events/handler.handler
      Code: ../build/backend/
      Role: !GetAtt EventsRole.Arn
      MemorySize: 256
      Timeout: 29
      Environment:
        Variables:
          TABLE_NAME: !Ref Table
  SesEventsRule:
    Type: AWS::Events::Rule
    Properties:
      EventBusName: default
      State: ENABLED
      EventPattern:
        source: [aws.ses]
        detail:
          mail:
            tags:
              'ses:configuration-set': [!Sub 'ht2-${Env}']
      Targets: [{Id: RecipientEvents, Arn: !GetAtt EventsFunction.Arn}]
  EventsInvokePermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref EventsFunction
      Action: lambda:InvokeFunction
      Principal: events.amazonaws.com
      SourceArn: !GetAtt SesEventsRule.Arn
      SourceAccount: !Ref 'AWS::AccountId'
  FirehoseRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal: {Service: firehose.amazonaws.com}
            Action: sts:AssumeRole
            Condition: {StringEquals: {'sts:ExternalId': !Ref 'AWS::AccountId'}}
      Policies:
        - PolicyName: EventDelivery
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: [s3:AbortMultipartUpload, s3:GetBucketLocation, s3:ListBucket, s3:ListBucketMultipartUploads]
                Resource: !GetAtt EventLogBucket.Arn
              - Effect: Allow
                Action: [s3:PutObject, s3:GetObject]
                Resource: [!Sub '${EventLogBucket.Arn}/ses-events/*', !Sub '${EventLogBucket.Arn}/errors/*']
  SesFirehoseRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal: {Service: ses.amazonaws.com}
            Action: sts:AssumeRole
            Condition:
              StringEquals: {'aws:SourceAccount': !Ref 'AWS::AccountId'}
              ArnEquals: {'aws:SourceArn': !Sub 'arn:${AWS::Partition}:ses:${AWS::Region}:${AWS::AccountId}:configuration-set/ht2-${Env}'}
      Policies:
        - PolicyName: SesEvents
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - {Effect: Allow, Action: 'firehose:PutRecordBatch', Resource: !GetAtt EventStream.Arn}
  EventStream:
    Type: AWS::KinesisFirehose::DeliveryStream
    Properties:
      DeliveryStreamName: !Sub 'ht2-${Env}-events'
      DeliveryStreamType: DirectPut
      DeliveryStreamEncryptionConfigurationInput: {KeyType: AWS_OWNED_CMK}
      ExtendedS3DestinationConfiguration:
        BucketARN: !GetAtt EventLogBucket.Arn
        RoleARN: !GetAtt FirehoseRole.Arn
        Prefix: 'ses-events/!{timestamp:yyyy/MM/dd}/'
        ErrorOutputPrefix: 'errors/!{firehose:error-output-type}/!{timestamp:yyyy/MM/dd}/'
        CompressionFormat: GZIP
        BufferingHints: {IntervalInSeconds: 300, SizeInMBs: 5}
  EventsDatabase:
    Type: AWS::Glue::Database
    Properties:
      CatalogId: !Ref 'AWS::AccountId'
      DatabaseInput: {Name: ht2_events}
  EventsTable:
    Type: AWS::Glue::Table
    Properties:
      CatalogId: !Ref 'AWS::AccountId'
      DatabaseName: !Ref EventsDatabase
      TableInput:
        Name: ses_events
        TableType: EXTERNAL_TABLE
        Parameters:
          classification: json
          'projection.enabled': 'true'
          'projection.dt.type': date
          'projection.dt.range': '2026/01/01,NOW'
          'projection.dt.format': yyyy/MM/dd
          'projection.dt.interval': '1'
          'projection.dt.interval.unit': DAYS
          'storage.location.template': !Join ['', ['s3://', !Ref EventLogBucket, '/ses-events/${dt}/']]
        PartitionKeys: [{Name: dt, Type: string}]
        StorageDescriptor:
          Location: !Sub 's3://${EventLogBucket}/ses-events/'
          InputFormat: org.apache.hadoop.mapred.TextInputFormat
          OutputFormat: org.apache.hadoop.hive.ql.io.HiveIgnoreKeyTextOutputFormat
          SerdeInfo: {SerializationLibrary: org.openx.data.jsonserde.JsonSerDe}
          Columns:
            - {Name: eventtype, Type: string}
            - {Name: mail, Type: 'struct<timestamp:string,messageid:string,source:string,destination:array<string>,tags:map<string,array<string>>>'}
            - {Name: send, Type: 'map<string,string>'}
            - {Name: delivery, Type: 'struct<timestamp:string,recipients:array<string>,smtpresponse:string,reportingmta:string,processingtimemillis:bigint>'}
            - {Name: bounce, Type: 'struct<timestamp:string,feedbackid:string,bouncetype:string,bouncesubtype:string,bouncedrecipients:array<struct<emailaddress:string,action:string,status:string,diagnosticcode:string>>>'}
            - {Name: complaint, Type: 'struct<timestamp:string,feedbackid:string,complaintfeedbacktype:string,complainedrecipients:array<struct<emailaddress:string>>>'}
            - {Name: deliverydelay, Type: 'struct<timestamp:string,delaytype:string,expirationtime:string,delayedrecipients:array<struct<emailaddress:string,status:string,diagnosticcode:string>>>'}
            - {Name: subscription, Type: 'struct<timestamp:string,contactlist:string,source:string,newtopicpreferences:struct<unsubscribeall:boolean,topicsubscriptionstatus:array<struct<topicname:string,subscriptionstatus:string>>,topicdefaultsubscriptionstatus:array<struct<topicname:string,subscriptionstatus:string>>>,oldtopicpreferences:struct<unsubscribeall:boolean,topicsubscriptionstatus:array<struct<topicname:string,subscriptionstatus:string>>,topicdefaultsubscriptionstatus:array<struct<topicname:string,subscriptionstatus:string>>>>'}
            - {Name: reject, Type: 'struct<reason:string>'}
            - {Name: failure, Type: 'struct<errormessage:string,templatename:string>'}
  AthenaWorkGroup:
    Type: AWS::Athena::WorkGroup
    Properties:
      Name: !Sub 'ht2-${Env}'
      WorkGroupConfiguration:
        EnforceWorkGroupConfiguration: true
        PublishCloudWatchMetricsEnabled: true
        BytesScannedCutoffPerQuery: 10737418240
        ResultConfiguration:
          OutputLocation: !Sub 's3://${EventLogBucket}/athena-results/'
          EncryptionConfiguration: {EncryptionOption: SSE_S3}
  UserPool:
    Type: AWS::Cognito::UserPool
    DeletionPolicy: RetainExceptOnCreate
    UpdateReplacePolicy: Retain
    Properties:
      UserPoolName: !Sub 'ht2-${Env}'
      UserPoolTier: ESSENTIALS
      DeletionProtection: !If [IsProd, ACTIVE, INACTIVE]
      UsernameAttributes: [email]
      UsernameConfiguration: {CaseSensitive: false}
      AutoVerifiedAttributes: [email]
      UserAttributeUpdateSettings: {AttributesRequireVerificationBeforeUpdate: [email]}
      AdminCreateUserConfig: {AllowAdminCreateUserOnly: true}
      Schema:
        - {Name: email, AttributeDataType: String, Required: true, Mutable: true}
        - {Name: name, AttributeDataType: String, Mutable: true}
      Policies:
        PasswordPolicy: {MinimumLength: 12, RequireUppercase: true, RequireLowercase: true, RequireNumbers: true, RequireSymbols: true, TemporaryPasswordValidityDays: 7}
      MfaConfiguration: 'ON'
      EnabledMfas: [SOFTWARE_TOKEN_MFA]
      AccountRecoverySetting: {RecoveryMechanisms: [{Name: verified_email, Priority: 1}]}
  WebClient:
    Type: AWS::Cognito::UserPoolClient
    Properties:
      UserPoolId: !Ref UserPool
      ClientName: WebClient
      GenerateSecret: false
      AllowedOAuthFlowsUserPoolClient: true
      AllowedOAuthFlows: [code]
      AllowedOAuthScopes: [openid, email, profile]
      SupportedIdentityProviders: [COGNITO]
      ExplicitAuthFlows: []
      ReadAttributes: [email, email_verified, name]
      WriteAttributes: [name]
      CallbackURLs: [!Sub 'https://${AppDomain}/callback.html']
      LogoutURLs: [!Sub 'https://${AppDomain}/']
      AccessTokenValidity: 15
      IdTokenValidity: 15
      RefreshTokenValidity: 8
      TokenValidityUnits: {AccessToken: minutes, IdToken: minutes, RefreshToken: hours}
      RefreshTokenRotation: {Feature: ENABLED, RetryGracePeriodSeconds: 0}
      EnableTokenRevocation: true
      PreventUserExistenceErrors: ENABLED
  UserPoolDomain:
    Type: AWS::Cognito::UserPoolDomain
    Properties:
      UserPoolId: !Ref UserPool
      Domain: !Ref CognitoDomainPrefix
      ManagedLoginVersion: 2
  ManagedLoginBranding:
    Type: AWS::Cognito::ManagedLoginBranding
    Properties:
      UserPoolId: !Ref UserPool
      ClientId: !Ref WebClient
      UseCognitoProvidedValues: true
  AdminGroup:
    Type: AWS::Cognito::UserPoolGroup
    Properties: {UserPoolId: !Ref UserPool, GroupName: admin}
  SenderGroup:
    Type: AWS::Cognito::UserPoolGroup
    Properties: {UserPoolId: !Ref UserPool, GroupName: sender}
  ApproverGroup:
    Type: AWS::Cognito::UserPoolGroup
    Properties: {UserPoolId: !Ref UserPool, GroupName: approver}
  ViewerGroup:
    Type: AWS::Cognito::UserPoolGroup
    Properties: {UserPoolId: !Ref UserPool, GroupName: viewer}
  OriginSecret:
    Type: AWS::SecretsManager::Secret
    DeletionPolicy: RetainExceptOnCreate
    UpdateReplacePolicy: Retain
    Properties:
      Name: !Sub '/ht2/${Env}/origin-verify'
      GenerateSecretString:
        SecretStringTemplate: '{"previous":""}'
        GenerateStringKey: current
        PasswordLength: 64
        ExcludePunctuation: true
  AddressHmacSecret:
    Type: AWS::SecretsManager::Secret
    DeletionPolicy: RetainExceptOnCreate
    UpdateReplacePolicy: Retain
    Properties:
      Name: !Sub '/ht2/${Env}/address-hmac'
      GenerateSecretString:
        SecretStringTemplate: '{"kid":"k1"}'
        GenerateStringKey: key
        PasswordLength: 64
        ExcludePunctuation: true
  EraseMacKey:
    Type: AWS::KMS::Key
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      KeySpec: HMAC_256
      KeyUsage: GENERATE_VERIFY_MAC
      PendingWindowInDays: 30
      KeyPolicy:
        Version: '2012-10-17'
        Statement:
          - Sid: EnableAccountPermissions
            Effect: Allow
            Principal: {AWS: !Sub 'arn:${AWS::Partition}:iam::${AWS::AccountId}:root'}
            Action: 'kms:*'
            Resource: '*'
  AuditLogGroup:
    Type: AWS::Logs::LogGroup
    Properties: {LogGroupName: !Sub '/aws/lambda/ht2-${Env}-audit', RetentionInDays: 365}
  ApiLogGroup:
    Type: AWS::Logs::LogGroup
    Properties: {LogGroupName: !Sub '/aws/lambda/ht2-${Env}-api', RetentionInDays: 365}
  WorkerLogGroup:
    Type: AWS::Logs::LogGroup
    Properties: {LogGroupName: !Sub '/aws/lambda/ht2-${Env}-worker', RetentionInDays: 365}
  StateMachineLogGroup:
    Type: AWS::Logs::LogGroup
    Properties: {LogGroupName: !Sub '/aws/vendedlogs/states/ht2-${Env}', RetentionInDays: 90}
  AccessLogGroup:
    Type: AWS::Logs::LogGroup
    Properties: {LogGroupName: !Sub '/ht2/${Env}/http-api', RetentionInDays: 365}
  AlertTopic:
    Type: AWS::SNS::Topic
    Properties:
      TopicName: !Sub 'ht2-${Env}-alerts'
      Subscription: [{Protocol: email, Endpoint: !Ref AlertEmail}]
  ScheduleGroup:
    Type: AWS::Scheduler::ScheduleGroup
    Properties: {Name: !Sub 'ht2-${Env}'}
  DailySchedule:
    Type: AWS::Scheduler::Schedule
    DependsOn: [SchedulerPolicy, WorkerPolicy]
    Properties:
      Name: !Sub 'ht2-${Env}-daily'
      GroupName: !Ref ScheduleGroup
      ScheduleExpression: cron(0 3 * * ? *)
      ScheduleExpressionTimezone: Asia/Tokyo
      FlexibleTimeWindow: {Mode: 'OFF'}
      Target:
        Arn: !GetAtt WorkerFunction.Arn
        RoleArn: !GetAtt SchedulerRole.Arn
        Input: '{"mode":"daily"}'
        RetryPolicy: {MaximumRetryAttempts: 0}
  ApiFunction:
    Type: AWS::Lambda::Function
    DependsOn: ApiLogGroup
    Properties:
      FunctionName: !Sub 'ht2-${Env}-api'
      Runtime: nodejs24.x
      RuntimeManagementConfig: !If
        - HasRuntimeVersion
        - {UpdateRuntimeOn: Manual, RuntimeVersionArn: !Ref RuntimeVersionArn}
        - {UpdateRuntimeOn: FunctionUpdate}
      Architectures: [arm64]
      Handler: src/api/handler.handler
      Code: ../build/backend/
      Role: !GetAtt ApiRole.Arn
      MemorySize: 256
      Timeout: 29
      LoggingConfig: {LogFormat: JSON, LogGroup: !Ref ApiLogGroup}
      Environment:
        Variables:
          ENV: !Ref Env
          TABLE_NAME: !Ref Table
          DATA_BUCKET: !Ref DataBucket
          CONTACT_LIST: !Ref ContactList
          CONFIG_SET: !Ref ConfigurationSet
          SENDER_DOMAIN: !Ref SenderDomain
          EVENT_STREAM_ARN: !GetAtt EventStream.Arn
          ALERT_TOPIC_ARN: !Ref AlertTopic
          WEB_CLIENT_ID: !Ref WebClient
          USER_POOL_ID: !Ref UserPool
          STATE_MACHINE_ARN: !Sub 'arn:${AWS::Partition}:states:${AWS::Region}:${AWS::AccountId}:stateMachine:ht2-${Env}'
          SCHEDULE_GROUP: !Ref ScheduleGroup
          SCHEDULER_ROLE_ARN: !GetAtt SchedulerRole.Arn
          WORKER_FUNCTION_ARN: !Sub 'arn:${AWS::Partition}:lambda:${AWS::Region}:${AWS::AccountId}:function:ht2-${Env}-worker'
          CONFIG_PARAM: !Sub '/ht2/${Env}/config'
          ORIGIN_SECRET_ARN: !Ref OriginSecret
          ADDRESS_HMAC_SECRET_ARN: !Ref AddressHmacSecret
          ERASE_MAC_KEY_ID: !Ref EraseMacKey
          LOG_LEVEL: INFO
  WorkerFunction:
    Type: AWS::Lambda::Function
    DependsOn: WorkerLogGroup
    Properties:
      FunctionName: !Sub 'ht2-${Env}-worker'
      Runtime: nodejs24.x
      RuntimeManagementConfig: !If
        - HasRuntimeVersion
        - {UpdateRuntimeOn: Manual, RuntimeVersionArn: !Ref RuntimeVersionArn}
        - {UpdateRuntimeOn: FunctionUpdate}
      Architectures: [arm64]
      Handler: src/worker/handler.handler
      Code: ../build/backend/
      Role: !GetAtt WorkerRole.Arn
      MemorySize: 512
      Timeout: 900
      ReservedConcurrentExecutions: !If [HasWorkerReservedConcurrency, !Ref WorkerReservedConcurrency, !Ref 'AWS::NoValue']
      LoggingConfig: {LogFormat: JSON, LogGroup: !Ref WorkerLogGroup}
      Environment:
        Variables:
          AUDIT_ARCHIVE_BUCKET: !Ref AuditArchiveBucket
          ENV: !Ref Env
          TABLE_NAME: !Ref Table
          DATA_BUCKET: !Ref DataBucket
          CONTACT_LIST: !Ref ContactList
          CONFIG_SET: !Ref ConfigurationSet
          SENDER_DOMAIN: !Ref SenderDomain
          EVENT_STREAM_ARN: !GetAtt EventStream.Arn
          ALERT_TOPIC_ARN: !Ref AlertTopic
          WEB_CLIENT_ID: !Ref WebClient
          USER_POOL_ID: !Ref UserPool
          STATE_MACHINE_ARN: !Sub 'arn:${AWS::Partition}:states:${AWS::Region}:${AWS::AccountId}:stateMachine:ht2-${Env}'
          SCHEDULE_GROUP: !Ref ScheduleGroup
          SCHEDULER_ROLE_ARN: !GetAtt SchedulerRole.Arn
          WORKER_FUNCTION_ARN: !Sub 'arn:${AWS::Partition}:lambda:${AWS::Region}:${AWS::AccountId}:function:ht2-${Env}-worker'
          CONFIG_PARAM: !Sub '/ht2/${Env}/config'
          ORIGIN_SECRET_ARN: !Ref OriginSecret
          ADDRESS_HMAC_SECRET_ARN: !Ref AddressHmacSecret
          ERASE_MAC_KEY_ID: !Ref EraseMacKey
          LOG_LEVEL: INFO
  AuditRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - {Effect: Allow, Principal: {Service: lambda.amazonaws.com}, Action: 'sts:AssumeRole'}
      Policies:
        - PolicyName: AuditArchive
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: ['logs:CreateLogStream', 'logs:PutLogEvents']
                Resource: !Sub 'arn:${AWS::Partition}:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/lambda/ht2-${Env}-audit:*'
              - Effect: Allow
                Action: ['dynamodb:DescribeStream', 'dynamodb:GetRecords', 'dynamodb:GetShardIterator', 'dynamodb:ListStreams']
                Resource: !GetAtt Table.StreamArn
              - Effect: Allow
                Action: ['s3:PutObject']
                Resource: [!Sub '${AuditArchiveBucket.Arn}/audit/*', !Sub '${AuditArchiveBucket.Arn}/tamper/*']
  AuditFunction:
    Type: AWS::Lambda::Function
    DependsOn: AuditLogGroup
    Properties:
      FunctionName: !Sub 'ht2-${Env}-audit'
      Runtime: nodejs24.x
      RuntimeManagementConfig: !If
        - HasRuntimeVersion
        - {UpdateRuntimeOn: Manual, RuntimeVersionArn: !Ref RuntimeVersionArn}
        - {UpdateRuntimeOn: FunctionUpdate}
      Architectures: [arm64]
      Handler: src/audit/handler.handler
      Code: ../build/backend/
      Role: !GetAtt AuditRole.Arn
      MemorySize: 256
      Timeout: 60
      LoggingConfig: {LogFormat: JSON, LogGroup: !Ref AuditLogGroup}
      Environment:
        Variables:
          ENV: !Ref Env
          AUDIT_ARCHIVE_BUCKET: !Ref AuditArchiveBucket
  AuditStreamMapping:
    Type: AWS::Lambda::EventSourceMapping
    Properties:
      FunctionName: !Ref AuditFunction
      EventSourceArn: !GetAtt Table.StreamArn
      StartingPosition: TRIM_HORIZON
      BatchSize: 100
      BisectBatchOnFunctionError: true
      MaximumRetryAttempts: -1
      MaximumRecordAgeInSeconds: -1
      FilterCriteria:
        Filters:
          - Pattern: '{"dynamodb":{"Keys":{"PK":{"S":[{"prefix":"AUDIT#"}]}}}}'
  WorkerEventInvokeConfig:
    Type: AWS::Lambda::EventInvokeConfig
    Properties: {FunctionName: !Ref WorkerFunction, Qualifier: '$LATEST', MaximumRetryAttempts: 0, MaximumEventAgeInSeconds: 60}
  BroadcastStateMachine:
    Type: AWS::StepFunctions::StateMachine
    DependsOn: StateMachinePolicy
    Properties:
      StateMachineName: !Sub 'ht2-${Env}'
      StateMachineType: STANDARD
      RoleArn: !GetAtt StateMachineRole.Arn
      DefinitionS3Location: broadcast.asl.json
      DefinitionSubstitutions:
        WorkerFunctionArn: !GetAtt WorkerFunction.Arn
        TableName: !Ref Table
      LoggingConfiguration:
        Level: ERROR
        IncludeExecutionData: false
        Destinations: [{CloudWatchLogsLogGroup: {LogGroupArn: !GetAtt StateMachineLogGroup.Arn}}]
  HttpApi:
    Type: AWS::ApiGatewayV2::Api
    Properties: {Name: !Sub 'ht2-${Env}', ProtocolType: HTTP}
  JwtAuthorizer:
    Type: AWS::ApiGatewayV2::Authorizer
    Properties:
      ApiId: !Ref HttpApi
      Name: CognitoJwt
      AuthorizerType: JWT
      IdentitySource: ['$request.header.Authorization']
      JwtConfiguration:
        Audience: [!Ref WebClient]
        Issuer: !Sub 'https://cognito-idp.${AWS::Region}.amazonaws.com/${UserPool}'
  ApiIntegration:
    Type: AWS::ApiGatewayV2::Integration
    Properties: {ApiId: !Ref HttpApi, IntegrationType: AWS_PROXY, IntegrationUri: !GetAtt ApiFunction.Arn, PayloadFormatVersion: '2.0', TimeoutInMillis: 29000}
  ApiRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref HttpApi
      RouteKey: 'ANY /api/{proxy+}'
      AuthorizationType: JWT
      AuthorizationScopes: [openid]
      AuthorizerId: !Ref JwtAuthorizer
      Target: !Sub 'integrations/${ApiIntegration}'
  ApiStage:
    Type: AWS::ApiGatewayV2::Stage
    Properties:
      ApiId: !Ref HttpApi
      StageName: '$default'
      AutoDeploy: true
      DefaultRouteSettings: {ThrottlingBurstLimit: 50, ThrottlingRateLimit: 20, DetailedMetricsEnabled: true}
      AccessLogSettings:
        DestinationArn: !GetAtt AccessLogGroup.Arn
        Format: '{"requestId":"$context.requestId","ip":"$context.identity.sourceIp","requestTime":"$context.requestTime","httpMethod":"$context.httpMethod","routeKey":"$context.routeKey","status":"$context.status","responseLength":"$context.responseLength","integrationLatency":"$context.integrationLatency","sub":"$context.authorizer.claims.sub"}'
  ApiPermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref ApiFunction
      Action: lambda:InvokeFunction
      Principal: apigateway.amazonaws.com
      SourceArn: !Sub 'arn:${AWS::Partition}:execute-api:${AWS::Region}:${AWS::AccountId}:${HttpApi}/*/*/api/*'
      SourceAccount: !Ref 'AWS::AccountId'
  OriginAccessControl:
    Type: AWS::CloudFront::OriginAccessControl
    Properties:
      OriginAccessControlConfig: {Name: !Sub 'ht2-${Env}', OriginAccessControlOriginType: s3, SigningBehavior: always, SigningProtocol: sigv4}
  SecurityHeaders:
    Type: AWS::CloudFront::ResponseHeadersPolicy
    Properties:
      ResponseHeadersPolicyConfig:
        Name: !Sub 'ht2-${Env}-security'
        SecurityHeadersConfig:
          StrictTransportSecurity: {AccessControlMaxAgeSec: 63072000, IncludeSubdomains: true, Preload: true, Override: true}
          ContentTypeOptions: {Override: true}
          FrameOptions: {FrameOption: DENY, Override: true}
          ReferrerPolicy: {ReferrerPolicy: no-referrer, Override: true}
          ContentSecurityPolicy:
            Override: true
            ContentSecurityPolicy: !Sub "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src 'self' https://${CognitoDomainPrefix}.auth.${AWS::Region}.amazoncognito.com; form-action 'self' https://${CognitoDomainPrefix}.auth.${AWS::Region}.amazoncognito.com; frame-ancestors 'none'; base-uri 'none'; object-src 'none'"
        CustomHeadersConfig:
          Items: [{Header: Permissions-Policy, Value: 'camera=(), microphone=(), geolocation=()', Override: true}]
  ApiCachePolicy:
    Type: AWS::CloudFront::CachePolicy
    Properties:
      CachePolicyConfig:
        Name: !Sub 'ht2-${Env}-api-no-cache'
        MinTTL: 0
        DefaultTTL: 0
        MaxTTL: 0
        ParametersInCacheKeyAndForwardedToOrigin:
          EnableAcceptEncodingGzip: false
          CookiesConfig: {CookieBehavior: none}
          HeadersConfig: {HeaderBehavior: none}
          QueryStringsConfig: {QueryStringBehavior: none}
  ApiOriginRequestPolicy:
    Type: AWS::CloudFront::OriginRequestPolicy
    Properties:
      OriginRequestPolicyConfig:
        Name: !Sub 'ht2-${Env}-api-forward'
        CookiesConfig: {CookieBehavior: all}
        HeadersConfig: {HeaderBehavior: allExcept, Headers: [host]}
        QueryStringsConfig: {QueryStringBehavior: all}
  Distribution:
    Type: AWS::CloudFront::Distribution
    Properties:
      DistributionConfig:
        Enabled: true
        HttpVersion: http2and3
        IPV6Enabled: true
        Aliases: [!Ref AppDomain]
        DefaultRootObject: index.html
        WebACLId: !Ref WebAclArn
        ViewerCertificate: {AcmCertificateArn: !Ref CertificateArn, SslSupportMethod: sni-only, MinimumProtocolVersion: TLSv1.2_2021}
        Origins:
          - Id: web
            DomainName: !GetAtt WebBucket.RegionalDomainName
            OriginAccessControlId: !Ref OriginAccessControl
            S3OriginConfig: {OriginAccessIdentity: ''}
          - Id: api
            DomainName: !Sub '${HttpApi}.execute-api.${AWS::Region}.amazonaws.com'
            CustomOriginConfig: {OriginProtocolPolicy: https-only, OriginSSLProtocols: [TLSv1.2]}
            OriginCustomHeaders:
              - HeaderName: x-origin-verify
                HeaderValue: !Sub '{{resolve:secretsmanager:${OriginSecret}:SecretString:current:${OriginSecretStage}}}'
        DefaultCacheBehavior:
          TargetOriginId: web
          ViewerProtocolPolicy: redirect-to-https
          AllowedMethods: [GET, HEAD]
          CachedMethods: [GET, HEAD]
          Compress: true
          CachePolicyId: 658327ea-f89d-4fab-a63d-7e88639e58f6
          ResponseHeadersPolicyId: !Ref SecurityHeaders
        CacheBehaviors:
          - PathPattern: /api/*
            TargetOriginId: api
            ViewerProtocolPolicy: https-only
            AllowedMethods: [GET, HEAD, OPTIONS, PUT, POST, PATCH, DELETE]
            CachedMethods: [GET, HEAD]
            CachePolicyId: !Ref ApiCachePolicy
            OriginRequestPolicyId: !Ref ApiOriginRequestPolicy
            ResponseHeadersPolicyId: !Ref SecurityHeaders
  WebBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref WebBucket
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal: {Service: cloudfront.amazonaws.com}
            Action: s3:GetObject
            Resource: !Sub '${WebBucket.Arn}/*'
            Condition: {StringEquals: {'AWS:SourceArn': !Sub 'arn:${AWS::Partition}:cloudfront::${AWS::AccountId}:distribution/${Distribution}'}}
          - Effect: Deny
            Principal: '*'
            Action: s3:*
            Resource: [!GetAtt WebBucket.Arn, !Sub '${WebBucket.Arn}/*']
            Condition: {Bool: {'aws:SecureTransport': 'false'}}
  AppRecord:
    Type: AWS::Route53::RecordSet
    Properties:
      HostedZoneId: !Ref HostedZoneId
      Name: !Ref AppDomain
      Type: A
      AliasTarget: {HostedZoneId: Z2FDTNDATAQYW2, DNSName: !GetAtt Distribution.DomainName}
  AppIpv6Record:
    Type: AWS::Route53::RecordSet
    Properties:
      HostedZoneId: !Ref HostedZoneId
      Name: !Ref AppDomain
      Type: AAAA
      AliasTarget: {HostedZoneId: Z2FDTNDATAQYW2, DNSName: !GetAtt Distribution.DomainName}
  ApiRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal: {Service: lambda.amazonaws.com}
            Action: sts:AssumeRole
  WorkerRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal: {Service: lambda.amazonaws.com}
            Action: sts:AssumeRole
  StateMachineRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal: {Service: states.amazonaws.com}
            Action: sts:AssumeRole
            Condition:
              StringEquals: {'aws:SourceAccount': !Ref 'AWS::AccountId'}
              ArnLike: {'aws:SourceArn': !Sub 'arn:${AWS::Partition}:states:${AWS::Region}:${AWS::AccountId}:stateMachine:ht2-${Env}'}
  SchedulerRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal: {Service: scheduler.amazonaws.com}
            Action: sts:AssumeRole
            Condition:
              StringEquals: {'aws:SourceAccount': !Ref 'AWS::AccountId'}
              ArnLike: {'aws:SourceArn': !Sub 'arn:${AWS::Partition}:scheduler:${AWS::Region}:${AWS::AccountId}:schedule-group/ht2-${Env}'}
  ApiPolicy:
    Type: AWS::IAM::Policy
    Properties:
      PolicyName: ApiRuntime
      Roles: [!Ref ApiRole]
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Action: ['dynamodb:DeleteItem']
            Resource: !GetAtt Table.Arn
            Condition: {'ForAllValues:StringLike': {'dynamodb:LeadingKeys': ['ADDR#*']}}
          - Effect: Allow
            Action: ['s3:DeleteObject']
            Resource: [!Sub '${DataBucket.Arn}/recipients/*', !Sub '${DataBucket.Arn}/imports/staging/*']
          - Effect: Allow
            Action: ['sns:Publish']
            Resource: !Ref AlertTopic
          - Effect: Allow
            Action: ['kms:GenerateMac']
            Resource: !GetAtt EraseMacKey.Arn
          - Effect: Allow
            Action: ['logs:CreateLogStream', 'logs:PutLogEvents']
            Resource: !Sub 'arn:${AWS::Partition}:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/lambda/ht2-${Env}-api:*'
          - Effect: Allow
            Action: ['ssm:GetParameter']
            Resource: !Sub 'arn:${AWS::Partition}:ssm:${AWS::Region}:${AWS::AccountId}:parameter/ht2/${Env}/config'
          - Effect: Allow
            Action: ['secretsmanager:GetSecretValue']
            Resource: [!Ref OriginSecret, !Ref AddressHmacSecret]
          - Effect: Allow
            # TransactWriteItemsは内包するPutのdynamodb:PutItemで認可される。
            Action: ['dynamodb:GetItem', 'dynamodb:PutItem', 'dynamodb:UpdateItem', 'dynamodb:Query']
            Resource: !GetAtt Table.Arn
          - Effect: Allow
            Action: ['ses:GetAccount', 'ses:GetSuppressedDestination', 'ses:GetImportJob']
            Resource: '*'
          - Effect: Allow
            Action: ['ses:GetEmailIdentity', 'ses:GetConfigurationSet', 'ses:GetConfigurationSetEventDestinations', 'ses:GetContactList', 'ses:ListContacts', 'ses:GetContact', 'ses:CreateContact', 'ses:UpdateContact', 'ses:DeleteContact', 'ses:CreateEmailTemplate', 'ses:GetEmailTemplate', 'ses:TestRenderEmailTemplate']
            Resource: [!Sub 'arn:${AWS::Partition}:ses:${AWS::Region}:${AWS::AccountId}:identity/${SenderDomain}', !Sub 'arn:${AWS::Partition}:ses:${AWS::Region}:${AWS::AccountId}:configuration-set/ht2-${Env}', !Sub 'arn:${AWS::Partition}:ses:${AWS::Region}:${AWS::AccountId}:contact-list/ht2', !Sub 'arn:${AWS::Partition}:ses:${AWS::Region}:${AWS::AccountId}:template/ht2-c-*']
          - Effect: Allow
            Action: ['ses:SendEmail']
            Resource: [!If [IsProd, !Sub 'arn:${AWS::Partition}:ses:${AWS::Region}:${AWS::AccountId}:identity/${SenderDomain}', !Sub 'arn:${AWS::Partition}:ses:${AWS::Region}:${AWS::AccountId}:identity/*'], !Sub 'arn:${AWS::Partition}:ses:${AWS::Region}:${AWS::AccountId}:configuration-set/ht2-${Env}', !Sub 'arn:${AWS::Partition}:ses:${AWS::Region}:${AWS::AccountId}:contact-list/ht2', !Sub 'arn:${AWS::Partition}:ses:${AWS::Region}:${AWS::AccountId}:template/ht2-c-*']
            Condition:
              StringLike: {'ses:FromAddress': !Sub '*@${SenderDomain}'}
          - Effect: Allow
            Action: ['cloudwatch:GetMetricData', 'cloudwatch:DescribeAlarms']
            Resource: '*'
          - Effect: Allow
            Action: ['s3:ListBucket']
            Resource: !GetAtt DataBucket.Arn
          - Effect: Allow
            Action: ['s3:GetObject']
            Resource: [!Sub '${DataBucket.Arn}/results/*', !Sub '${DataBucket.Arn}/delivery-checks/*', !Sub '${DataBucket.Arn}/imports/report/*', !Sub '${DataBucket.Arn}/recipients/*', !Sub '${DataBucket.Arn}/allowlists/*']
          - Effect: Allow
            Action: ['s3:PutObject']
            Resource: [!Sub '${DataBucket.Arn}/imports/staging/*', !Sub '${DataBucket.Arn}/delivery-checks/*']
          - Effect: Allow
            Action: ['states:StartExecution']
            Resource: !Sub 'arn:${AWS::Partition}:states:${AWS::Region}:${AWS::AccountId}:stateMachine:ht2-${Env}'
          - Effect: Allow
            Action: ['states:DescribeExecution']
            Resource: !Sub 'arn:${AWS::Partition}:states:${AWS::Region}:${AWS::AccountId}:execution:ht2-${Env}:*'
          - Effect: Allow
            Action: ['states:SendTaskSuccess', 'states:SendTaskFailure']
            Resource: '*'
          - Effect: Allow
            Action: ['scheduler:CreateSchedule', 'scheduler:DeleteSchedule', 'scheduler:GetSchedule']
            Resource: !Sub 'arn:${AWS::Partition}:scheduler:${AWS::Region}:${AWS::AccountId}:schedule/ht2-${Env}/ht2-*'
          - Effect: Allow
            Action: ['iam:PassRole']
            Resource: !GetAtt SchedulerRole.Arn
            Condition: {StringEquals: {'iam:PassedToService': scheduler.amazonaws.com}}
          - Effect: Allow
            Action: ['cognito-idp:AdminGetUser', 'cognito-idp:AdminListGroupsForUser', 'cognito-idp:ListUsersInGroup', 'cognito-idp:AdminCreateUser', 'cognito-idp:AdminAddUserToGroup', 'cognito-idp:AdminRemoveUserFromGroup', 'cognito-idp:AdminDisableUser', 'cognito-idp:AdminEnableUser', 'cognito-idp:AdminUserGlobalSignOut', 'cognito-idp:AdminSetUserMFAPreference', 'cognito-idp:AdminResetUserPassword']
            Resource: !GetAtt UserPool.Arn
          - Effect: Allow
            Action: ['lambda:InvokeFunction']
            Resource: !Sub 'arn:${AWS::Partition}:lambda:${AWS::Region}:${AWS::AccountId}:function:ht2-${Env}-worker'
          - Sid: DenyFixedTemplateMutation
            Effect: Deny
            Action: ['ses:UpdateEmailTemplate', 'ses:DeleteEmailTemplate']
            Resource: !Sub 'arn:${AWS::Partition}:ses:${AWS::Region}:${AWS::AccountId}:template/ht2-c-*'
          - Sid: DenyDestructiveSes
            Effect: Deny
            Action: ['ses:DeleteContactList', 'ses:UpdateContactList', 'ses:DeleteEmailIdentity', 'ses:DeleteSuppressedDestination', 'ses:PutAccount*']
            Resource: '*'
          - Sid: DenyAuditMutation
            Effect: Deny
            Action: ['dynamodb:UpdateItem', 'dynamodb:DeleteItem']
            Resource: !GetAtt Table.Arn
            Condition:
              'ForAnyValue:StringLike': {'dynamodb:LeadingKeys': ['AUDIT#*']}
          - Sid: DenyAuditArchiveMutation
            Effect: Deny
            Action: ['s3:BypassGovernanceRetention', 's3:PutObjectRetention', 's3:PutObjectLegalHold', 's3:DeleteObject*', 's3:PutBucketObjectLockConfiguration']
            Resource: [!GetAtt AuditArchiveBucket.Arn, !Sub '${AuditArchiveBucket.Arn}/*']
  WorkerPolicy:
    Type: AWS::IAM::Policy
    Properties:
      PolicyName: WorkerRuntime
      Roles: [!Ref WorkerRole]
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Action: ['dynamodb:Scan', 'dynamodb:GetItem']
            Resource: !Sub 'arn:${AWS::Partition}:dynamodb:${AWS::Region}:${AWS::AccountId}:table/ht2-${Env}-restore-*'
          - Effect: Allow
            Action: ['states:ListExecutions']
            Resource: !Sub 'arn:${AWS::Partition}:states:${AWS::Region}:${AWS::AccountId}:stateMachine:ht2-${Env}'
          - Effect: Allow
            Action: ['states:SendTaskFailure']
            Resource: '*'
          - Effect: Allow
            Action: ['lambda:InvokeFunction']
            Resource: !Sub 'arn:${AWS::Partition}:lambda:${AWS::Region}:${AWS::AccountId}:function:ht2-${Env}-worker'
          - Effect: Allow
            Action: ['ses:DeleteSuppressedDestination']
            Resource: '*'
          - Effect: Allow
            Action: ['s3:DeleteObject']
            Resource: [!Sub '${DataBucket.Arn}/recipients/*', !Sub '${DataBucket.Arn}/imports/staging/*']
          - Effect: Allow
            Action: ['kms:GenerateMac', 'kms:DescribeKey']
            Resource: !GetAtt EraseMacKey.Arn
          - Effect: Allow
            Action: ['s3:ListBucket']
            Resource: !GetAtt AuditArchiveBucket.Arn
          - Effect: Allow
            Action: ['s3:GetObject']
            Resource: !Sub '${AuditArchiveBucket.Arn}/*'
          - Effect: Allow
            Action: ['dynamodb:DeleteItem']
            Resource: !GetAtt Table.Arn
            Condition: {'ForAllValues:StringLike': {'dynamodb:LeadingKeys': [CONTACT_META, 'ADDR#*']}}
          - Effect: Allow
            Action: ['logs:CreateLogStream', 'logs:PutLogEvents']
            Resource: !Sub 'arn:${AWS::Partition}:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/lambda/ht2-${Env}-worker:*'
          - Effect: Allow
            Action: ['ssm:GetParameter']
            Resource: !Sub 'arn:${AWS::Partition}:ssm:${AWS::Region}:${AWS::AccountId}:parameter/ht2/${Env}/config'
          - Effect: Allow
            Action: ['secretsmanager:GetSecretValue']
            Resource: !Ref AddressHmacSecret
          - Effect: Allow
            Action: ['dynamodb:GetItem', 'dynamodb:PutItem', 'dynamodb:UpdateItem', 'dynamodb:Query', 'dynamodb:BatchGetItem']
            Resource: !GetAtt Table.Arn
          - Effect: Allow
            Action: ['ses:GetAccount', 'ses:CreateImportJob', 'ses:GetImportJob']
            Resource: '*'
          - Effect: Allow
            Action: ['ses:GetEmailIdentity', 'ses:GetConfigurationSet', 'ses:GetConfigurationSetEventDestinations', 'ses:GetContactList', 'ses:ListContacts']
            Resource: [!Sub 'arn:${AWS::Partition}:ses:${AWS::Region}:${AWS::AccountId}:identity/${SenderDomain}', !Sub 'arn:${AWS::Partition}:ses:${AWS::Region}:${AWS::AccountId}:configuration-set/ht2-${Env}', !Sub 'arn:${AWS::Partition}:ses:${AWS::Region}:${AWS::AccountId}:contact-list/ht2', !Sub 'arn:${AWS::Partition}:ses:${AWS::Region}:${AWS::AccountId}:template/ht2-c-*']
          - Effect: Allow
            Action: ['ses:GetContact', 'ses:DeleteContact']
            Resource: !Sub 'arn:${AWS::Partition}:ses:${AWS::Region}:${AWS::AccountId}:contact-list/ht2'
          - Effect: Allow
            Action: ['ses:SendEmail']
            Resource: [!If [IsProd, !Sub 'arn:${AWS::Partition}:ses:${AWS::Region}:${AWS::AccountId}:identity/${SenderDomain}', !Sub 'arn:${AWS::Partition}:ses:${AWS::Region}:${AWS::AccountId}:identity/*'], !Sub 'arn:${AWS::Partition}:ses:${AWS::Region}:${AWS::AccountId}:configuration-set/ht2-${Env}', !Sub 'arn:${AWS::Partition}:ses:${AWS::Region}:${AWS::AccountId}:contact-list/ht2', !Sub 'arn:${AWS::Partition}:ses:${AWS::Region}:${AWS::AccountId}:template/ht2-c-*']
            Condition:
              StringLike: {'ses:FromAddress': !Sub '*@${SenderDomain}'}
          - Effect: Allow
            Action: ['ses:DeleteEmailTemplate']
            Resource: !Sub 'arn:${AWS::Partition}:ses:${AWS::Region}:${AWS::AccountId}:template/ht2-c-*'
          - Effect: Allow
            Action: ['cloudwatch:GetMetricData', 'cloudwatch:DescribeAlarms']
            Resource: '*'
          - Effect: Allow
            Action: ['s3:ListBucket']
            Resource: !GetAtt DataBucket.Arn
          - Effect: Allow
            Action: ['s3:GetObject']
            Resource: [!Sub '${DataBucket.Arn}/imports/*', !Sub '${DataBucket.Arn}/recipients/*', !Sub '${DataBucket.Arn}/results/*', !Sub '${DataBucket.Arn}/backups/*', !Sub '${DataBucket.Arn}/delivery-checks/*', !Sub '${DataBucket.Arn}/allowlists/*', !Sub '${DataBucket.Arn}/restore-reports/*']
          - Effect: Allow
            Action: ['s3:PutObject']
            Resource: [!Sub '${DataBucket.Arn}/imports/*', !Sub '${DataBucket.Arn}/recipients/*', !Sub '${DataBucket.Arn}/results/*', !Sub '${DataBucket.Arn}/backups/*', !Sub '${DataBucket.Arn}/restore-reports/*']
          - Effect: Allow
            Action: ['sns:Publish']
            Resource: !Ref AlertTopic
          - Effect: Allow
            Action: ['states:DescribeExecution']
            Resource: !Sub 'arn:${AWS::Partition}:states:${AWS::Region}:${AWS::AccountId}:execution:ht2-${Env}:*'
          - Effect: Allow
            Action: ['scheduler:GetSchedule', 'scheduler:DeleteSchedule']
            Resource: !Sub 'arn:${AWS::Partition}:scheduler:${AWS::Region}:${AWS::AccountId}:schedule/ht2-${Env}/ht2-*'
          - Sid: DenyFixedTemplateMutation
            Effect: Deny
            Action: ['ses:UpdateEmailTemplate']
            Resource: !Sub 'arn:${AWS::Partition}:ses:${AWS::Region}:${AWS::AccountId}:template/ht2-c-*'
          - Sid: DenyDestructiveSes
            Effect: Deny
            Action: ['ses:DeleteContactList', 'ses:UpdateContactList', 'ses:DeleteEmailIdentity', 'ses:PutAccount*']
            Resource: '*'
          - Sid: DenyAuditMutation
            Effect: Deny
            Action: ['dynamodb:UpdateItem', 'dynamodb:DeleteItem']
            Resource: !GetAtt Table.Arn
            Condition:
              'ForAnyValue:StringLike': {'dynamodb:LeadingKeys': ['AUDIT#*']}
          - Sid: DenyAuditArchiveMutation
            Effect: Deny
            Action: ['s3:BypassGovernanceRetention', 's3:PutObjectRetention', 's3:PutObjectLegalHold', 's3:DeleteObject*', 's3:PutBucketObjectLockConfiguration']
            Resource: [!GetAtt AuditArchiveBucket.Arn, !Sub '${AuditArchiveBucket.Arn}/*']
  StateMachinePolicy:
    Type: AWS::IAM::Policy
    Properties:
      PolicyName: Broadcast
      Roles: [!Ref StateMachineRole]
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Action: ['lambda:InvokeFunction']
            Resource: !Sub 'arn:${AWS::Partition}:lambda:${AWS::Region}:${AWS::AccountId}:function:ht2-${Env}-worker'
          - Effect: Allow
            Action: ['dynamodb:UpdateItem']
            Resource: !GetAtt Table.Arn
            Condition: {'ForAllValues:StringEquals': {'dynamodb:LeadingKeys': [CAMPAIGN]}}
          - Effect: Allow
            Action: ['logs:CreateLogDelivery', 'logs:GetLogDelivery', 'logs:UpdateLogDelivery', 'logs:DeleteLogDelivery', 'logs:ListLogDeliveries', 'logs:PutResourcePolicy', 'logs:DescribeResourcePolicies', 'logs:DescribeLogGroups']
            Resource: '*'
  SchedulerPolicy:
